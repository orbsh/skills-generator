[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skills-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "structlog",
    "jinja2",
    "pyyaml",
    "duckdb",
    "polars",
    # 日志子模块下沉至 skillforge（logging.py），此处为本地路径依赖
    "skillforge @ file:///home/master/world/skillforge",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts/skills_generator"]
